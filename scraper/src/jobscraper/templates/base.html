<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}jobscraper{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .badge { @apply px-2 py-0.5 rounded text-xs font-medium; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <nav class="bg-slate-900 text-white">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-6">
        <a href="/" class="font-bold text-lg">jobscraper</a>
        <a href="/" class="hover:text-amber-300">Overview</a>
        <a href="/jobs" class="hover:text-amber-300">Jobs</a>
        <a href="/learn" class="hover:text-amber-300">Learn</a>
      </div>
      <div class="text-xs text-slate-400">Mohamed Attia — personal dashboard</div>
    </div>
  </nav>
  <main class="max-w-7xl mx-auto p-4">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
